meta:
  title: Archiku | Team
  description: |
    Meet the agents: four specialized agents and a unified knowledge engine, working alongside a human analyst.

sections:
  - id: hero
    type: intro
    kicker: Team
    title: Meet our agents!
    intro:
      - |
        Four specialized agents and a unified knowledge engine, working alongside a human analyst.

  # ------------------------------------------------ team
  - id: team
    type: profiles
    subtitle: |
      While the industry points AI at generating more code output, Archiku points it
      the other way. Our agents excel at unstructured research, tracing behavior
      back to the source to uncover truth. Archiku is an integrated team of four
      specialized agents and a unified knowledge engine working alongside a human
      analyst: Carter fully analyzes the code, Harper interacts with your team,
      Argus opens the resulting knowledge as an interactive observatory and Oracle
      explains findings directly from the Vault.
    items:
      - title: Carter
        icon: bi-map
        bio1: |
          Carter is a true excavator. He digs through your code and any existing
          documentation, layer by layer, oldest evidence first, until the original
          intent surfaces again.
        bio2: |
          Hand Carter a system, a delivery or an entire estate and the result is
          the same: a map of what it really does, traceable to the exact line of
          code. Methodical, thorough and never in a hurry to judge.
      - title: Harper
        icon: bi-mic
        bio1: |
          Harper loves to listen to people. Code does not remember everything,
          people do. Harper connects down with your people, in their language, and
          gathers the testimony the code cannot give: decisions taken, reasons
          forgotten, knowledge that only lives in heads.
        bio2: |
          What Harper hears is checked against what Carter finds and the gaps in
          the analysis close. The listener of the team.
      - title: Argus
        icon: bi-eye
        bio1: |
          Argus is the observatory of the team. A hundred eyes, never all closed
          at once. Every fact, every report, every corner of the analysis is open
          for inspection: Argus is where you and the analysis meet.
        bio2: |
          Reading reports is only the beginning. In the observatory you browse the
          full fact base, query it in conversation and raise objections. An
          objection is a first-class fact too: the platform picks it up and a run
          works it back into the analysis.
      - title: Oracle
        icon: bi-compass
        bio1: |
          Oracle is your trustworthy counsel. An analysis you cannot question is
          just a document. Oracle answers in the language of the asker: technical for
          developers, business language for the board, regulatory language for
          compliance.
        bio2: |
          Every answer carries the same traceability as the analysis it comes
          from. Consult the Oracle whenever reading code is not the job at hand.
    vault:
      title: The Vault
      icon: bi-safe
      text: |
        The Vault holds the universal truth of your software. Every fact it
        holds conforms to the Archiku Analysis Metamodel: structured,
        citation-anchored and versioned. Delivered today as a comprehensive
        baseline knowledge engine, it forms the exact foundation for our
        automated tracking dashboard launching soon.
