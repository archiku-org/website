  # ------------------------------------------------ faq
  - id: faq
    nav_label: FAQ
    type: faq
    title: Questions you may have
    subtitle: |
      The questions C-level asks before trusting an outside party with their
      software. Answered up front.
    items:
      - q: Are you a competitor to our consultancy or EA tooling provider?
        a: |
          No. Archiku provides the information layer, not the services or the
          tools built on top of it. Consultancies and EA providers can build on
          our insights and add their own personal layers on top. We help
          everybody in the software market, at any level, without interfering
          with any other level.
      - q: Is my code used to train AI models?
        a: |
          No. Your code is analyzed on our own hardware with locally hosted
          models, in an isolated environment for each client. Nothing is sent to
          public AI services and no model is trained on your code. Ever.
      - q: Do you replace my team?
        a: |
          No. We give your team the starting point it deserves. Every finding is
          delivered for your experts to validate, extend and own. Archiku's
          mandate ends where your team's authority begins, and that is written
          into the engagement.
      - q: Do you replace my software delivery vendor?
        a: |
          No. We do not build software and we do not sell implementation, so we
          have no stake in their work. That is the point: an independent analysis
          of what was actually delivered. If your vendor is doing well, the
          analysis shows it, and you finally have the evidence. If it is not, you
          see that early, in traceable findings, and Argus can keep watching on
          your behalf.
      - q: What if the analysis is wrong?
        a: |
          Every finding cites its exact place in the code, so you can verify any
          claim in seconds. Before delivery, the analysis passes independent
          review by multiple agents in multiple passes, and sampled findings are
          re-verified with the pass rate published. Your experts remain the final
          authority, by design.
      - q: Which languages and technologies do you support?
        a: |
          The standard pipeline covers mainstream backend languages such as Java,
          C#, Python and PHP. Other stacks are possible after a short
          exploration. The Phase 0 intake is where we confirm fit before any
          commitment.
      - q: How is this different from AI coding assistants like Copilot or Cursor?
        a: |
          Those tools help developers write code. Archiku produces independent
          insight about code: what a system does, how it has drifted and whether
          delivered work conforms. Different question, different product, and no
          human analyst validation in those tools.
      - q: How is this different from a consultancy audit?
        a: |
          A classic audit bills a team by the day and hands you a report. Archiku
          delivers a validated baseline analysis in days at a fixed fee,
          traceable to the exact line of code and independently reviewed. And it
          does not end at delivery: the Vault keeps the knowledge alive.
      - q: What does it cost?
        a: |
          The Phase 0 intake is €1,500 for one module of up to 2,500 lines of
          code, analyzed within 48 hours. It is fully credited toward the full
          analysis if we proceed. Full analyses run at fixed fees from €3,900 by
          scope. No value shown in Phase 0 means you pay nothing.
      - q: What happens to my code after the engagement?
        a: |
          It stays yours and it stays yours alone. It lives in the isolated
          environment only for the duration of the analysis. When the engagement
          ends, the working copies are purged. The deliverable, the knowledge, is
          yours to keep.
      - q: Who owns the deliverable?
        a: |
          You do. The validated baseline analysis is yours: your experts validate
          it, extend it and own it. It is built to outlive the engagement.
      - q: How do the agents get access to our code?
        a: |
          On our hardware, in an isolated per-client environment, under NDA, with
          the access you choose to grant: a copy of one module for Phase 0, or a
          read-only view of your repository for monitoring. You see exactly what
          is accessed and nothing leaves that perimeter.

