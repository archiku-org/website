sections:
  # ------------------------------------------------ hero
  - id: top
    type: hero
    logo_img: img/archiku-white-transp-bg.png
    tagline: |
      Agent-Augmented Software Archaeology<br />Uncovering the essence. Keeping it alive.
    opener: Do you really know your software?
    opener_sub: |
      Not what it was designed to do. Not what the documentation says it does.
      What it does. Today.
    cards:
      - title: The system you inherited...
        text: |
          ...has outlived everyone who understood it. The knowledge left with its
          makers and often nobody can even say whether modernizing it is
          possible at all.
      - title: The system your vendor delivered...
        text: |
          ...comes with promises, not proof. Did you get what you paid for? How can you evaluate the deliverable without reiterating the entire work line for line?
      - title: The codebase your team ships...
        text: |
          ...drifts a little further from the plan with every release. Can you track that drift and use that knowledge to steer, without introducing a parallel review team that inherently lags behind?
    closing:
      - |
        Different systems, context and goals, yet always the same bottom-line question.
        Every one of them was active code once, before the changes nobody recorded
        turned it into a black box.
      - When you know what your software really does, you can decide, budget,
        verify and comply. When you do not, every choice is a bet.
    pitch: |
      Archiku delivers independent insight into what your software really is.
      A team of agents digs through your codebase and produces a validated baseline analysis in days. Every finding is traceable to the exact line of code,
      independently reviewed by multiple agents, reinforcing your experts again as the
      final authority.
    cta_label: Get a Risk-Free Preview Analysis
    cta_anchor: deliverables

  # ------------------------------------------------ deliverables
  - id: deliverables
    nav_label: Deliverables
    type: badge-cards
    title: What you get
    subtitle: |
      Archiku supports your situation in several ways, starting with a standard
      analysis, extending it where you need it.
    items:
      - title: Functional analysis
        icon: bi-file-earmark-ruled
        badge: Standard
        badge_style: primary
        text: |
          The business essence of your system, told technology-free: the actors,
          the processes, the core concepts. The document your team can finally
          read, so you regain control over the system.
      - title: Modernization analysis
        icon: bi-signpost-split
        badge: Architecture Extension
        badge_style: secondary
        text: |
          What would moving this system forward actually require? Based on your
          preferences, a transformation plan and roadmap can be added to the
          analysis.
      - title: Issue and bug detection
        icon: bi-bug
        badge: Code Level Extension
        badge_style: secondary
        text: |
          Know where the code is fragile, before your change uncovers it the hard
          way. This complements the functional analysis on a technical level,
          allowing deeper insights into the road ahead, or even the current blast
          radius.
      - title: Living Repository
        icon: bi-safe
        badge: Coming Soon
        badge_style: warning
        text: |
          A comprehensive, highly structured knowledge base of your entire codebase. Instead of heavy, static PDF reports, you receive an interactive asset designed to integrate directly into your engineering workflows.
      - title: Interactive Querying
        icon: bi-compass
        badge: Coming Soon
        badge_style: warning
        text: |
          Reporting and charts tell you a lot about your codebase, until you have a single specific question. On top of the living repository, we will soon offer the opportunity to literally have a chat about the analysis reality that hides in your codebase.
      - title: Continuous Monitoring
        icon: bi-eye
        badge: Coming Soon
        badge_style: warning
        text: |
          Future-proof your active codebases. Transition your one-time validated
          analysis into a living, automated dashboard. Our upcoming monitoring module
          is designed to track repository drift against your validated functional baseline.

  # ------------------------------------------------ use cases
  - id: usecases
    nav_label: Use cases
    type: numbered-cards
    title: Sounds familiar?
    subtitle: |
      Situations we hear about every week. If one of them is yours, the
      bottom-line question it is the same: Do you really know what your
      software does?
    items:
      - title: The system nobody dares to touch
        text: |
          An undocumented legacy system runs your business, but its makers are long
          gone.
          <br><br>
          Archiku delivers an independent functional map of the codebase, turning
          an operational black box into a clear roadmap for decisions.
      - title: The delivery you need to verify
        text: |
          A third party built your software, but the warranty or acquisition date is
          closing in.
          <br><br>
          Archiku delivers an independent as-built analysis to prove exactly what was
          delivered, letting you verify vendor promises directly against the code.
      - title: The requirements nobody checked the code against
        text: |
          Your business requirements and functional documentation haven't kept pace
          with active development.
          <br><br>
          Archiku runs an independent comparison of your actual codebase against your
          functional baseline, turning assumptions about system conformance into
          verifiable facts.
      - title: The codebase your team ships every week
        text: |
          Rapid releases mean nobody truly knows how the overall system is evolving.
          <br><br>
          Archiku establishes a clear baseline of your current state, mapping the
          functional essence so code drift is captured before it compromises your
          system quality.
      - title: The estate you just inherited
        text: |
          As a incoming CIO or CTO, you need to map out a complex IT estate built on
          organizational folklore.
          <br><br>
          Archiku replaces subjective war stories with a living, system-by-system
          architectural overview, grounding your first hundred days in hard technical
          data.
      - title: The team that starts from nothing
        text: |
          A new development team is taking over a complex codebase with zero context or
          documentation.
          <br><br>
          Archiku delivers a validated baseline analysis that acts as an architectural
          map from day one, making your team productive in weeks rather than quarters
          of blind code reading.
      - title: The decision you cannot make yet
        text: |
          You are weighing whether to modernize, migrate or wrap an expensive legacy
          system.
          <br><br>
          Archiku provides the objective insight your business case needs in days, at a
          fixed fee, allowing you to budget and decide based on facts instead of
          guesswork.
      - title: The regulator who asks what your systems do
        text: |
          Compliance frameworks like DORA and NIS2 demand strict, documented proof of system governance.
          <br><br>
          Archiku constructs a fully traceable, auditable baseline that regulators ask
          for, transforming annual compliance assessments from a panic into a routine.
      - title: The tidal wave of AI-generated code
        text: |
          Your employees love the swift and endless code generation capabilities of the
          readily available code harnesses, co-pilots and chat bots. But who can review
          all that code?
          <br><br>
          In stead of denying this opportunity, with Archiku you have at least an
          equally capable reviewer by your side.

  # ------------------------------------------------ benefits
  - id: benefits
    nav_label: Benefits
    type: values
    title: What's in it for you
    subtitle: |
      Archiku provides insight, supporting your decisions.
    items:
      - title: Independent insight
        icon: bi-fingerprint
        text: |
          Archiku has no stake in your build decisions. We do not write your
          software, we do not sell its implementation, we answer to nobody but
          the facts in your code. Whether the question is an inherited system,
          a vendor's delivery or your own team's work, the insight is
          independent and yours alone.
      - title: Timely
        icon: bi-stopwatch
        text: |
          The Phase 0 intake covers up to 10K SLOC and is analyzed within 48
          business hours of successful onboarding. A full validated baseline
          analysis is delivered in days, at a fixed fee and a fixed scope agreed up
          front. No open-ended engagements.
      - title: Cost-effective
        icon: bi-cash-coin
        text: |
          A fixed fee instead of months of billable archaeology by a team. The
          Phase 0 intake costs €1,500 and is fully credited toward the full
          analysis when we proceed. If it shows no value, you pay nothing.
      - title: Privacy-first
        icon: bi-shield-lock
        text: |
          Your code is analyzed on hardware we control, in an isolated per-client
          environment. Your code is never sent to public AI services and no model is
          ever trained on it. Ever.
      - title: Full traceability
        icon: bi-crosshair
        text: |
          Every finding cites the exact file and line it came from. Nothing is
          claimed that cannot be pointed at.
      - title: Full auditability
        icon: bi-patch-check
        text: |
          The analysis passes a multi-pass agentic review pipeline before human validation, with our baseline verification metrics open to your inspection.
      - title: 25 years of experience
        icon: bi-award
        text: |
          Agents are fast, but the method is the product: a quarter century
          of software and functional analysis, from analysis craft to BPMN and
          UML modelling, drives what Archiku looks for and how findings are judged.

  # ------------------------------------------------ process
  - id: process
    nav_label: Process
    type: steps
    title: How it works
    items:
      - title: Explore
        icon: bi-compass
        text: |
          A short joint exploration of your project, free of charge. If Archiku is
          not the right help, we say so and stop there.
      - title: Intake
        icon: bi-lightning-charge
        text: |
          Together we select a module for a risk-free initial analysis, analyzed
          within 48 hours and presented to you by the analyst who stands behind it.
      - title: Decide
        icon: bi-cash-coin
        text: |
          No value shown, you pay nothing. Value shown, a flat fee €1,500 for the
          initial deliverable. Move forward with a full scope analysis? We credit
          the €1,500.
      - title: Analyze
        icon: bi-diagram-3
        text: |
          Full validated baseline analysis, fixed fee, in days. Multi-pass agentic
          review before anything reaches you.
      - title: Own
        icon: bi-people
        text: |
          Your experts can validate, extend and own the resulting analysis. We can
          still support you with any targeted follow-up analysis.
    callout:
      title: Your risk-free decision
      text: |
        No value shown? You pay nothing and the code is purged. Value shown?
        You pay a flat fee of €1,500 and own the initial deliverable, and the fee
        is fully credited toward a full analysis when you continue within 60 days.

  # ------------------------------------------------ about
  - id: about
    nav_label: About
    type: split
    title: The human in the loop
    image: img/avatar.png
    image_alt: Christophe Van Ginneken
    paragraphs:
      - |
        We call our method <strong>software archaeology</strong>: digging through the complex layers of a system until the original business intent surfaces again. While our agentic workflows read code at massive speeds, experienced humans decide what it means. Archiku pairs this automated power with a seasoned analyst who structurally validates every finding and personally presents the insights live to your team.
      - |
        Christophe Van Ginneken has analyzed, modeled and architected
        business-critical software for over 25 years, as analyst, analyst coach
        and architect, for financial services, logistics and transport, public
        sector, technology and manufacturing. Connect with him on
        <a href="https://www.linkedin.com/in/christophevg/">LinkedIn</a>.
      - |
        His research on Agentic Workflows is published as a series of articles
        on <a href="https://christophe.vg/about/Hello-Agents">his personal
        website</a> and documents the principles behind the Archiku approach.

  # ------------------------------------------------ team
  - id: team
    nav_label: Team
    type: profiles
    title: Meet the team
    subtitle: |
      While the industry points AI at generating more code output, Archiku points it
      the other way. Our agents excel at unstructured research, tracing behavior
      back to the source to uncover truth. Archiku is an integrated team of four
      specialized agents and a unified knowledge engine working alongside a human
      analyst: Carter fully analyzes the code, Harper interacts with your team, our
      upcoming Argus module is designed to watch for drift and Oracle will explain
      findings directly from the Vault.
    items:
      - title: Carter
        icon: bi-map
        bio1: |
          Carter is a true excavator. He digs through your code and any existing
          documentation, layer by layer, oldest evidence first, until the original
          intent surfaces again.
        bio2: |
          Hand Carter a system, a delivery or an entire estate and the result is
          the same: a map of what it really does, traceable to the exact line of
          code. Methodical, thorough and never in a hurry to judge.
      - title: Harper
        icon: bi-mic
        bio1: |
          Harper loves to listen to people. Code does not remember everything,
          people do. Harper connects down with your people, in their language, and
          gathers the testimony the code cannot give: decisions taken, reasons
          forgotten, knowledge that only lives in heads.
        bio2: |
          What Harper hears is checked against what Carter finds and the gaps in
          the analysis close. The listener of the team.
      - title: Argus
        icon: bi-eye
        bio1: |
          Argus is our watchman. A hundred eyes, never all closed at once. He
          watches the codebase as it lives: every push, every change, every drift
          away from the baseline.
        bio2: |
          What Argus sees is reported in language a board can act on. And it is
          Argus who keeps the knowledge up to date, so the issues it surfaces reach you
          before they become surprises.
      - title: Oracle
        icon: bi-compass
        bio1: |
          Oracle is your trustworthy counsel. An analysis you cannot question is
          just a document. Oracle answers in the language of the asker: technical for
          developers, business language for the board, regulatory language for
          compliance.
        bio2: |
          Every answer carries the same traceability as the analysis it comes
          from. Consult the Oracle whenever reading code is not the job at hand.
    vault:
      title: The Vault
      icon: bi-safe
      text: |
        The Vault holds the universal truth of your software. Delivered today as a
        comprehensive baseline knowledge engine, it forms the exact foundation for our
        automated tracking dashboard launching later this year.

