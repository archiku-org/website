    cta_anchor: process

  # ------------------------------------------------ use cases
  - id: usecases
    nav_label: Use cases
    type: numbered-cards
    title: Recognize your software?
    subtitle: |
      Eight situations we hear about every week. If one of them is yours, the
      question underneath it is the same: do you really know what your
      software does?
    items:
      - title: The system nobody dares to touch
        text: |
          Somewhere in your organisation runs software that everything depends on
          and nobody understands anymore. Its makers are gone, its documentation
          is dead, and every change risks the unknown. What your team needs is an
          independent map of what the system really does: the system's functional
          essence, traceable to the exact line of code, delivered in days instead
          of months of code reading. Too critical to touch becomes understood,
          and ready to decide about.
      - title: The delivery you need to verify
        text: |
          A third party built or rebuilt software for you. The contract ended,
          the warranty is running out, or the acquisition is approaching. Did you
          get what you paid for? What you need is an independent as-built
          analysis: what was actually built, how it works, where it deviates from
          the plan. No stake in the answer, every finding traceable to the code.
          And afterwards, someone who keeps watching what changes in the repo and
          reports it to you, not to the builder.
      - title: The requirements nobody checked the code against
        text: |
          You have a functional analysis. You have requirements. But the code has
          been changing since the day they were written, and nobody can say they
          still agree. What you need is an independent comparison of the system
          as it is actually built against your functional analysis and
          requirements, every deviation reported and traceable to the code. And
          then every future change checked against the same bar. Conformance
          stops being an assumption.
      - title: The codebase your team ships every week
        text: |
          Development is alive. Releases go out every week. But nobody outside
          the team, and honestly not even inside it, can say what the system has
          become. What you need is a baseline of what the system is today, and an
          independent watcher that analyzes every push against that baseline, so
          drift is captured while it happens. Progress, quality and conformance,
          reported to you, not just to the team.
      - title: The estate you just inherited
        text: |
          You have just taken over the IT estate, as CIO, CTO or new owner. Nobody
          can hand you the overview: what systems exist, what they actually do,
          which ones carry the risk. What you need is that overview, built system
          by system and kept in one place, up to date: a living picture of what
          your organisation really runs. Your first hundred days, grounded in
          facts instead of war stories.
      - title: The team that starts from nothing
        text: |
          A new team is taking over. Insourcing after the vendor left, key people
          gone, or an acquisition folded in. They inherit the code, the deadlines
          and zero context. What they need is a validated baseline analysis to
          start from, instead of months of code reading, and a place where they
          can ask their questions from day one. Your team is productive in weeks,
          not quarters.
      - title: The decision you cannot make yet
        text: |
          Modernize, migrate, wrap or leave it. Every option paper assumes
          somebody knows what the system does. What you need is the insight the
          decision needs, in days at a fixed fee, before you commit a budget.
          Decide on facts, not on folklore.
      - title: The regulator who asks what your systems do
        text: |
          Under DORA, financial entities must assess their legacy ICT systems
          every year. Under NIS2, management is personally liable for security
          and can only evidence what is documented. An undocumented estate is a
          governance liability. What you need is the documented, traceable
          baseline these obligations ask for, and for it to stay current, so next
          year's assessment starts from knowledge, not from panic.

  # ------------------------------------------------ team
  - id: team
    nav_label: Team
    type: profiles
    title: Meet the team
    subtitle: |
      Archiku is not a toolkit. It is a team: four agents and one vault, each
      with its own craft, all in service of one thing. The truth about your
      software. Carter reads the code, Harper reads the people, Argus watches
      it all, Oracle speaks from the Vault. And the Vault remembers.
    items:
      - title: Carter
        icon: bi-map
        bio1: |
          Carter is a true excavator. He digs through your code and any existing
          documentation, layer by layer, oldest evidence first, until the original
          intent surfaces again.
        bio2: |
          Hand Carter a system, a delivery or an entire estate and the result is
          the same: a map of what it really does, traceable to the exact line of
          code. Methodical, thorough and never in a hurry to judge.
      - title: Harper
        icon: bi-mic
        bio1: |
          Harper loves to listen to people. Code does not remember everything,
          people do. Harper sits down with your people, in their language, and
          gathers the testimony the code cannot give: decisions taken, reasons
          forgotten, knowledge that only lives in heads.
        bio2: |
          What Harper hears is checked against what Carter finds, and the gaps in
          the analysis close. The listener of the team.
      - title: Argus
        icon: bi-eye
        bio1: |
          Argus is our watchman. A hundred eyes, never all closed at once. He
          watches the codebase as it lives: every push, every change, every drift
          away from the baseline.
        bio2: |
          What Argus sees is reported in language a board can act on. And it is
          Argus who keeps the Vault's knowledge up to date, so the issues it
          surfaces reach you before they become surprises.
      - title: Oracle
        icon: bi-compass
        bio1: |
          Oracle is your trustworthy counsel. An analysis you cannot question is
          just a document. Oracle answers, straight from the Vault, in the
          language of the asker: technical for developers, business language for
          the board, regulatory language for compliance.
        bio2: |
          Every answer carries the same traceability as the analysis it comes
          from. Consult the Oracle whenever reading code is not the job at hand.
    vault:
      title: The Vault
      icon: bi-safe
      text: |
        The Vault is a true memory. It is the steady state at the centre of the
        team. It holds the universal truth of what your software really is:
        every finding, every citation, every validated insight, in one place.
        It does not dig and it does not watch. It holds, it remembers, and
        because Argus never stops watching, it never goes stale. Code enters
        the perimeter, knowledge is all that comes out, and what the Vault
        holds outlives every engagement, every vendor and every reorganisation.

  # ------------------------------------------------ why
  - id: why
    type: prose
    title: Why Archiku
    paragraphs:
      - |
        Agents excel at unstructured work: reading, researching, connecting the
        dots. The industry points them at generating output. Archiku points them
        the other way.
      - |
        Archiku lets agents do what they do best. They read your entire codebase,
        trace behaviour to the source, map the business essence, and generate the
        input your people work from.
      - |
        We call this <strong>software archaeology</strong>: digging through the
        layers of a system until the original intent surfaces again.

  # ------------------------------------------------ benefits
  - id: benefits
    nav_label: Benefits
    type: values
    title: What's in it for you
    subtitle: |
      Archiku sells insight. These are the values we sell, and the values
      that prove them.
    groups:
      - title: The values we sell
        items:
          - title: Independent insight
            icon: bi-fingerprint
            text: |
              Archiku has no stake in your build decisions. We do not write your
              software, we do not sell its implementation, we answer to nobody but
              the facts in your code. Whether the question is an inherited system,
              a vendor's delivery or your own team's work, the insight is
              independent and yours alone.
          - title: Timely
            icon: bi-stopwatch
            text: |
              The Phase 0 intake is analyzed within 48 hours. A full validated
              baseline analysis is delivered in days, at a fixed fee and a fixed
              scope agreed up front. No open-ended engagements.
          - title: Cost-effective
            icon: bi-cash-coin
            text: |
              A fixed fee instead of months of billable archaeology by a team. The
              Phase 0 intake costs €1,500 and is fully credited toward the full
              analysis when we proceed. If it shows no value, you pay nothing.
      - title: What proves them
        items:
          - title: Privacy-first
            icon: bi-shield-lock
            text: |
              Your code is analyzed on hardware we control, with locally hosted
              models in an isolated per-client environment. Your code is never sent
              to public AI services and no model is ever trained on it. Ever.
          - title: Full traceability
            icon: bi-crosshair
            text: |
              Every finding cites the exact file and line it came from. Nothing is
              claimed that cannot be pointed at.
          - title: Full auditability
            icon: bi-patch-check
            text: |
              The analysis passes independent multi-agent, multi-pass review before
              anything reaches you, and sampled findings are re-verified with the
              pass rate published. The process itself is the proof, and it is open
              to your inspection.
          - title: 25 years of experience
            icon: bi-award
            text: |
              The agents are fast, but the method is the product: a quarter century
              of software and functional analysis, from analysis craft to BPMN and
              UML modelling, drives what Carter looks for and how findings are
              judged.

