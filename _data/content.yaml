meta:
  title: Archiku | Agent-Augmented Software Archaeology
  description: |
    Gain independent, line-level architectural insight into your codebase. Archiku combines multi-agent workflows with expert analysis: a validated baseline analysis in days, measured at twelve analyst-days of work on our public case study.

footer:
  copyright: |
    Copyright © 2026, Archiku, Agent-Augmented Software Archaeology,
    is a product of <a href="https://2know.be">2Know BV</a>

sections:
  # ------------------------------------------------ hero
  - id: top
    type: hero
    logo_img: /assets/img/archiku-white-transp-bg.png
    tagline: |
      Agent-Augmented Software Archaeology<br />Uncovering the essence. Keeping it alive.
    opener: Do you really know your software?
    opener_sub: |
      Not what it was designed to do. Not what the documentation says it does.
      What it does. Today.
    cards:
      - title: The system you inherited...
        text: |
          ...has outlived everyone who understood it. The knowledge left with its
          makers and often nobody can even say whether modernizing it is
          possible at all.
      - title: The system your vendor delivered...
        text: |
          ...comes with promises, not proof. Did you get what you paid for? How can you evaluate the deliverable without reiterating the entire work line for line?
      - title: The codebase your team ships...
        text: |
          ...drifts a little further from the plan with every release. Can you track that drift and use that knowledge to steer, without introducing a parallel review team that inherently lags behind?
    closing:
      - |
        Unrecorded knowledge turns active code into a black box. Know your software, and you can budget, verify and comply. Guess and every choice is a bet.
    pitch: |
      Archiku delivers rapid, independent insight into your codebase. Our agents deliver a validated baseline analysis in days, not weeks. With every finding traced to a line of code and independently reviewed, your experts remain the ultimate authority.

  # ------------------------------------------------ triage
  - id: triage
    type: tracks
    intro: |
      Uncover the Archiku site at your own pace. Choose your own focus...
    items:
      - title: What is Archiku?
        text: |
            Ready to explore our offering? Want to understand how we can help? Learn how we work? Meet the team?
        image: assets/img/metamodel.png
        link: /next.html#deliverables
        link_label: Keep reading...
      - title: Get the context
        text: |
            Learn by example? Read the <i>Financials</i> case study and understand our offering following a real story and a real analysis.
        image: assets/img/track-case-study.png
        link: /case-study/
        link_label: Start with the case study
      - title: Skip the intro
        text: |
            Already familiar with software archaeology? Know what you should expect from a functional analysis?<br>
            Read the reports, browse the fact sheets.
        image: assets/img/track-analysis.png
        link: /case-study/financials/
        link_label: See an actual analysis

  # ------------------------------------------------ deliverables
  - id: deliverables
    nav_label: Deliverables
    type: badge-cards
    title: What you get
    subtitle: |
      Archiku supports your situation in several ways, starting with a standard
      analysis, extending it where you need it.
    items:
      - title: Functional analysis
        icon: bi-file-earmark-ruled
        badge: Standard
        badge_style: primary
        text: |
          The business essence of your system, told technology-free: the actors,
          the processes, the core concepts. The document your team, both business and technical, can finally read, so you regain control over the system.
        link: /functional-analysis/
        link_label: What is a functional analysis?
      - title: Targeted extensions
        icon: bi-signpost-split
        badge: Extension
        badge_style: primary
        text: |
          Extend the functional analysis where you need it: a modernization
          analysis with a transformation plan and roadmap, or technical issue
          and bug detection that shows where the code is fragile, the road
          ahead and even the current blast radius.
      - title: Enterprise Integration
        icon: bi-puzzle
        badge: Enterprise
        badge_style: primary
        text: |
          Your methodology, our platform. We tailor the Archiku Analysis
          Metamodel to your own analysis artefacts and match custom agents to
          them, delivering exactly the facts your organisation needs, down to
          enterprise-level analysis such as DORA and NIS2 compliance.
      - title: Living Repository
        icon: bi-safe
        badge: Coming Soon
        badge_style: warning
        text: |
          Today, a validated baseline analysis materializes as a static,
          wiki-like site: every fact in place, fully interlinked, yours to
          keep. Soon, the same fact base becomes a living repository: an
          interactive asset that integrates directly into your engineering
          workflows.
      - title: Interactive Querying
        icon: bi-compass
        badge: Coming Soon
        badge_style: warning
        text: |
          Reporting and charts tell you a lot about your codebase, until you
          have a single specific question. Soon, the observatory opens: chat
          about your analysis, ask what you want and receive answers with
          the same traceability as every fact behind them.
      - title: Continuous Monitoring
        icon: bi-eye
        badge: Coming Soon
        badge_style: warning
        text: |
          Future-proof your active codebases. Your one-time validated analysis
          becomes the baseline: the platform runs a check at regular intervals,
          tracking repository drift against your validated functional baseline
          and reporting it in language a board can act on.

  # ------------------------------------------------ use cases
  - id: usecases
    nav_label: Use cases
    type: usecase-groups
    title: Sounds familiar?
    subtitle: |
      Situations we hear about every week, in three families. If one of them
      is yours, the bottom-line question is always the same: do you really
      know what your software does?
    items:
      - title: Acquire
        icon: bi-box-arrow-in-down
        pitch: |
          Taking a codebase in, on your terms.
        text: |
          From simply adopting codebases that already live inside your
          organisation to a full analysis before an acquisition closes.
          What did you actually take in, what does it really do and can
          your people take it from here?
        link: /usecases/acquire
        link_label: Explore Acquire
        cases:
          - The delivery you need to verify
          - The estate you just inherited
          - The team that starts from nothing
          - The tidal wave of AI-generated code
      - title: Modernize
        icon: bi-signpost
        pitch: |
          Deciding what becomes of legacy.
        text: |
          Modernize, migrate, wrap or retire. Decide what to do with aging
          codebases based on facts, weighed against your constraints and
          preferences, not on folklore.
        link: /usecases/modernize
        link_label: Explore Modernize
        cases:
          - The system nobody dares to touch
          - The decision you cannot make yet
          - The information your development partner needs
          - The in-house tool everybody loves
      - title: Follow up
        icon: bi-activity
        pitch: |
          Keeping knowledge alive while code changes.
        text: |
          Understand the changes applied to active codebases as they are
          applied. Validate them internally or externally, keep your
          reporting up to date and hold independent overviews
          of open functional issues.
        link: /usecases/follow-up
        link_label: Explore Follow up
        cases:
          - The requirements nobody checked the code against
          - The codebase your team ships every week
          - The regulator who asks what your systems do

  # ------------------------------------------------ benefits
  - id: benefits
    nav_label: Benefits
    type: tabs
    title: What's in it for you
    subtitle: |
      Archiku provides insight, supporting your decisions at multiple levels.
    groups:
      - tab: Speed & Value
        id: speed
        items:
        - title: Days, not months
          icon: bi-rocket-takeoff
          text: |
            Reading code is the bottleneck: a seasoned analyst reads about 200
            lines per hour. Our Financials case study, sized to the Phase 0
            scope, measures the full human analysis at twelve working days.
            Archiku delivered the same analysis in two days, at the cost of
            two analyst-days.
        - title: Timely
          icon: bi-stopwatch
          text: |
            The Phase 0 intake covers up to 10K SLOC and is analyzed within 48
            business hours of successful onboarding, at a fixed fee and a fixed
            scope agreed up front. No open-ended engagements.
        - title: Cost-effective
          icon: bi-cash-coin
          text: |
            A fixed fee instead of months of billable archaeology by a team.
            Measured on our case study scope: what costs a human analyst
            twelve working days, costs two here. The Phase 0 intake is €1,500
            and is fully credited toward the full analysis when we proceed.
            If it shows no value, you pay nothing.
      - tab: Trust & Security
        id: trust
        items:
        - title: Independent insight
          icon: bi-fingerprint
          text: |
            Archiku has no stake in your build decisions. We do not write your
            software, we do not sell its implementation, we answer to nobody but
            the facts in your code. Whether the question is an inherited system,
            a vendor's delivery or your own team's work, the insight is
            independent and yours alone.
        - title: Privacy-first
          icon: bi-shield-lock
          text: |
            Your code is analyzed on hardware we control, in an isolated per-client
            environment. Your code is never sent to public AI services and no model is
            ever trained on it. Ever.
        - title: Full traceability
          icon: bi-crosshair
          text: |
            Every finding cites the exact file and line it came from. Nothing is
            claimed that cannot be pointed at.
        - title: Full auditability
          icon: bi-patch-check
          text: |
            The analysis passes a multi-pass agentic review pipeline before human validation, with our baseline verification metrics open to your inspection.

      - tab: Expertise & Method
        id: expertise
        items:
        - title: A jumpstart, not a handover
          icon: bi-people
          text: |
            The analysis is always owned by humans. Archiku takes the slow
            part, reading the code, so your experts start from a readable,
            line-cited report that reads in about an hour. Judgement begins
            from structured facts, not from days of raw code.
        - title: Beyond the happy path
          icon: bi-binoculars
          text: |
            Over 35 fact types capture the codebase from every angle:
            processes, concepts and rules, but also issues, hotspots, quirks
            and conventions. People describe the happy path well. The real
            costs lurk in the small details, and that is where the analysis
            looks first.
        - title: 25 years of experience
          icon: bi-award
          text: |
            Agents are fast, but the method is the product: a quarter century
            of software and functional analysis, from analysis craft to BPMN and
            UML modelling, drives what Archiku looks for and how findings are judged.

  # ------------------------------------------------ method
  - id: method
    type: values
    title: The Archiku Analysis Method
    subtitle: |
      Archiku applies a grounded method to every functional analysis. One
      declarative metamodel defines what a finding may be, the platform enforces it
      and every finding stays structured, versioned and traceable.
    items:
      - title: Structured, not scraped
        icon: bi-bricks
        text: |
          Every finding is captured as a structured fact in the Archiku
          Analysis Metamodel: entities, relations and taxonomies the whole
          platform understands. Not prose scraped from code, but knowledge
          with a schema and functional relevance.
      - title: Enforced by the platform
        icon: bi-check2-square
        text: |
          The Vault enforces the metamodel on every write. A fact that does not
          conform does not enter. Structure is not promised, it is guaranteed.
      - title: Versioned and append-only
        icon: bi-clock-history
        text: |
          Facts are write-once and every analysis is versioned. Enrichment is
          always a new linked fact, so the history of the knowledge is
          preserved and auditable.
      - title: Derived with lineage
        icon: bi-diagram-2
        text: |
          Every deliverable is derived from the fact base, with lineage back to the
          source facts. Nothing is rendered that cannot be traced.
      - title: Tailored to your methodology
        icon: bi-sliders
        text: |
          The metamodel is configuration, not code. In our enterprise offering it can
          be tailored to your own analysis methodology, with custom agents matched
          to produce and consume exactly the facts you need.
    button:
      label: Learn more about Functional Analysis
      url: "/functional-analysis"

  # ------------------------------------------------ process
  - id: process
    type: steps
    title: How we work
    items:
      - title: Explore
        icon: bi-compass
        text: |
          A short joint exploration of your project, free of charge. If Archiku is
          not the right help, we say so and stop there.
      - title: Intake
        icon: bi-lightning-charge
        text: |
          Together we select a module for a risk-free initial analysis, analyzed
          within 48 hours and presented to you by the analyst who stands behind it.
      - title: Decide
        icon: bi-cash-coin
        text: |
          No value shown, you pay nothing. Value shown, a flat fee €1,500 for the
          initial deliverable. Move forward with a full scope analysis? We credit
          the €1,500.
      - title: Analyze
        icon: bi-diagram-3
        text: |
          Full validated baseline analysis, fixed fee, in days. Multi-pass agentic
          review before anything reaches you.
      - title: Own
        icon: bi-people
        text: |
          Your experts can validate, extend and own the resulting analysis. We can
          still support you with any targeted follow-up analysis.
    callout:
      title: Your risk-free decision
      text: |
        No value shown? You pay nothing and the code is purged. Value shown?
        You pay a flat fee of €1,500 and own the initial deliverable, and the fee
        is fully credited toward a full analysis when you continue within 60 days.
    button:
      label: Discover it in the Financials Case Study
      url: "/case-study"

  # ------------------------------------------------ about
  - id: about
    type: split
    title: The human in the loop
    image: /assets/img/avatar.png
    image_alt: Christophe Van Ginneken
    paragraphs:
      - |
        We call our method <strong>software archaeology</strong>: digging through the complex layers of a system until the original business intent surfaces again. While our agentic workflows read code at massive speeds, experienced humans decide what it means. Archiku pairs this automated power with a seasoned analyst who structurally validates every finding and personally presents the insights live to your team.
      - |
        <b>Christophe Van Ginneken</b> has analyzed, modeled and architected
        business-critical software for over 25 years, as analyst, analyst coach
        and architect, for financial services, logistics and transport, public
        sector, technology and manufacturing. Connect with him on
        <a href="https://www.linkedin.com/in/christophevg/">LinkedIn</a>.
      - |
        His research on <b>Agentic Workflows</b> is published as a series of informal articles on <a href="https://christophe.vg/about/Hello-Agents">his personal
        website</a> and documents the principles behind the Archiku approach.
      - |
        Archiku is foremost Christophe, your human in the loop. Inside the loop <b>Carter, Harper, Argus and Oracle</b> join him to deliver your next analysis. <br>
        <b><a href="/team/">Meet the team!</a></b>

