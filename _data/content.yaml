# =====================================================================
# Archiku website content — single source of truth.
#
# Rendered by Jekyll into the homepage (index.html is the template):
#   make serve / make build (see Makefile, _config.yml, Gemfile)
# Each entry in `sections` is a content block with:
#   id     — anchor used by the nav and internal links
#   type   — the representation; maps to _includes/sections/<type>.html
#   nav_label — optional; when present the section appears in the nav,
#               in the order the sections appear here
#   ...    — content fields (title, subtitle, items, ...)
#
# Layout lives in index.html / _includes — edit only content here.
# Reorder sections by moving blocks; the nav order follows automatically.
# Delete or add whole sections freely.
# =====================================================================

