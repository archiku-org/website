    opener: Do you really know your software?
    opener_sub: |
      Not what it was designed to do. Not what the documentation says it does.
      What it does. Today.
    cards:
      - title: The system you inherited
        text: |
          Has outlived everyone who understood it. The knowledge left with its
          makers, and often nobody can even say whether modernizing it is
          possible at all.
      - title: The system your vendor delivered
        text: |
          Comes with promises, not proof. Did you get what you paid for? Every
          finding is traceable to the exact line of code, so you can verify any
          claim in seconds.
      - title: The codebase your team ships
        text: |
          Drifts a little further from the plan with every release. Every change
          is independently reviewed, with your experts in the loop as the final
          authority.
    closing:
      - |
        Different systems, same question. And every one of them was active code
