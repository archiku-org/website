        icon: bi-file-earmark-ruled
        text: |
          Executive summary, scope and coverage, concepts, business
          rules, process flows, feature specifications, data entities,
          non-goals, quirks and sensitivities.
      - title: Every claim traceable
        icon: bi-crosshair
        text: |
          Each finding cites the exact file and line it came from. What
