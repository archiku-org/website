<div class="row gx-4 gx-lg-5 justify-content-center">
  <div class="col-lg-8 text-center">
    <h2 class="mt-0">{{ include.section.title }}</h2>
    {% if include.section.text %}
    <hr class="divider" />
    <p class="lead text-muted">
      {{ include.section.text | markdownify | remove: '<p>' | remove: '</p>' }}
    </p>
    {% endif %}
    <p>
      <a class="btn btn-primary btn-xl" href="{{ include.section.link }}">{{ include.section.label }}</a>
    </p>
  </div>
</div>
