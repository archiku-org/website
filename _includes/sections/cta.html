<section class="page-section bg-light" id="{{ include.section.id }}">
  <div class="container px-4 px-lg-5">
    <div class="row gx-4 gx-lg-5 justify-content-center">
      <div class="col-lg-8 text-center">
        <h2 class="mt-0">{{ include.section.title }}</h2>
        <hr class="divider" />
        <p class="lead">
          {{ include.section.subtitle | markdownify }}
        </p>
        <p>
          <a class="btn btn-primary btn-xl" href="{{ include.section.button_url }}">{{ include.section.button_label }}</a>
        </p>
      </div>
    </div>
  </div>
</section>
