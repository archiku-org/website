<div class="row gx-4 gx-lg-5 justify-content-center">
  <div class="col-lg-8 text-center">
    <h2 class="mt-0">{{ include.section.title }}</h2>
    <hr class="divider" />
    <p class="lead text-muted mb-5">
      {{ include.section.subtitle }}
    </p>
  </div>
</div>

<div class="container my-1">

  <!-- Viewpoint Navigation Tabs -->
  <ul class="nav nav-pills justify-content-center mb-4 gap-2" id="insightTabs" role="tablist">
    {% for group in include.section.groups %}
    <li class="nav-item" role="presentation">
      <button class="nav-link{% if forloop.first %} active{% endif %} px-4 py-2 fw-semibold" id="{{ group.id }}-tab" data-bs-toggle="tab" data-bs-target="#{{ group.id }}" type="button" role="tab">
        {{ group.tab }}
      </button>
    </li>
    {% endfor %}
  </ul>

  <!-- Tab Content Area -->
  <div class="tab-content bg-light pt-4" id="insightTabsContent">

    {% for group in include.section.groups %}
    <div class="tab-pane fade show{% if forloop.first %} active{% endif %}" id="{{ group.id }}" role="tabpanel">
      {% include sections/values.html section=group notembedded=false %}
    </div>
    {% endfor %}

  </div>
</div>
