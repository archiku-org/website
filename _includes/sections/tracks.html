<div class="row gx-4 gx-lg-5 justify-content-center mb-5">
  <div class="col-lg-8 text-center">
    <p class="lead text-muted mb-0">
      {{ include.section.intro }}
    </p>
  </div>
</div>

<div class="container my-1">
  <div class="row g-4">

    {% for item in include.section.items %}
    <div class="col-md-4">
      <div class="card h-100 border-0 shadow-sm hover-lift">
        <img src="{{ item.image }}" class="card-img-top object-fit-cover" alt="Software Archaeology Analysis" style="height: 160px;">
        <div class="card-body d-flex flex-column justify-content-between p-4">
          <div>
            <h3 class="h5 card-title fw-bold text-dark">{{ item.title }}</h3>
            <p class="card-text text-muted small">{{ item.text }}</p>
          </div>
          <a href="{{ item.link }}" class="btn btn-primary w-100 mt-4">{{ item.link_label }}</a>
        </div>
      </div>
    </div>
    {% endfor %}

  </div>
</div>
