<div class="row gx-4 gx-lg-5 justify-content-center">
  <div class="col-lg-8 text-center mb-4">
    {% if include.section.kicker %}
    <p class="text-primary fw-bold small text-uppercase mb-2">{{ include.section.kicker }}</p>
    {% endif %}

    <h2 class="mb-3">{{ include.section.title }}</h2>

    <p class="lead text-muted mb-0">{{ include.section.headline }}</p>

    {% if include.section.intro %}
    <hr class="divider" />
    {% for para in include.section.intro %}
    <p class="lead text-muted">{{ para }}</p>
    {% endfor %}
    {% endif %}
  </div>
</div>
