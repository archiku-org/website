<section class="page-section bg-light" id="{{ include.section.id }}">
  <div class="container px-4 px-lg-5">
    <div class="row gx-4 gx-lg-5 justify-content-center">
      <div class="col-lg-8 text-center">
        <h2 class="mt-0">{{ include.section.title }}</h2>
        <hr class="divider" />
        <p class="lead text-muted mb-5">
          {{ include.section.subtitle }}
        </p>
      </div>
    </div>
    {% for group in include.section.groups %}
    <h3 class="values-tier">{{ group.title }}</h3>
    <div class="row gx-4 gx-lg-5 justify-content-center">
      {% for item in group.items %}
      <div class="col-lg-5 mb-4 benefit">
        <h3 class="mb-2"><i class="{{ item.icon }} text-primary me-2"></i>{{ item.title }}</h3>
        <p class="text-muted mb-0">{{ item.text }}</p>
      </div>
      {% endfor %}
    </div>
    {% endfor %}
  </div>
</section>
