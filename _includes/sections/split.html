<div class="row gx-4 gx-lg-5 justify-content-center">
  <div class="col-lg-8 text-center">
    <h2 class="mt-0">{{ include.section.title }}</h2>
    <hr class="divider" />
  </div>
</div>
<div class="row gx-4 gx-lg-5 align-items-center">
  <div class="col-lg-4 text-center">
    <img src="{{ include.section.image }}" class="portrait mx-auto" alt="{{ include.section.image_alt }}" />
  </div>
  <div class="col-lg-8">
    {% for paragraph in include.section.paragraphs %}
    <p class="lead">
      {{ paragraph }}
    </p>
    {% endfor %}
  </div>
</div>
